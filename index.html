<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1b1145">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Steaguri, Atlas, Matematică &amp; Logică</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./assets/icon-192.png">
<link rel="apple-touch-icon" href="./assets/icon-192.png">
<link rel="stylesheet" href="./css/style.css">
</head>
<body data-fx="high">

<canvas id="fxcanvas" aria-hidden="true"></canvas>

<!-- ============================================================= HUB -->
<section class="screen is-active" id="screen-hub">
  <header class="hub-head">
    <div class="hub-title">
      <span class="hub-kicker" data-i18n="hubKicker">Joacă și învață</span>
      <h1 data-i18n="pickGame">Alege jocul</h1>
    </div>
    <button class="icon-btn" id="btn-hub-settings" aria-label="Setari"></button>
  </header>

  <div class="hub-grid">
    <button class="game-card is-flags" id="hub-flags">
      <span class="game-art flags-art" id="hub-flags-art" aria-hidden="true"></span>
      <span class="game-body">
        <span class="game-title" data-i18n="gameFlags">Steaguri</span>
        <span class="game-sub" data-i18n="gameFlagsSub">Ghicește steagurile lumii</span>
        <span class="game-foot">
          <span class="game-tag" data-i18n="tagFlags">6 jocuri</span>
          <span class="game-rec" id="hub-rec-flags" hidden></span>
        </span>
      </span>
    </button>
    <button class="game-card is-atlas" id="hub-atlas">
      <span class="game-art atlas-art" id="hub-atlas-art" aria-hidden="true"></span>
      <span class="game-body">
        <span class="game-title" data-i18n="gameAtlas">Atlas</span>
        <span class="game-sub" data-i18n="gameAtlasSub">Țări, provincii, munți, râuri, mări</span>
        <span class="game-foot">
          <span class="game-tag is-hard" data-i18n="tagAtlas">Mai greu</span>
          <span class="game-rec" id="hub-rec-atlas" hidden></span>
        </span>
      </span>
      <span class="game-loading"><i></i><span data-i18n="loadingMap">Se încarcă harta…</span></span>
    </button>
    <button class="game-card is-math" id="hub-math">
      <span class="game-art math-art" id="hub-math-art" aria-hidden="true"></span>
      <span class="game-body">
        <span class="game-title" data-i18n="gameMath">Matematică</span>
        <span class="game-sub" data-i18n="gameMathSub">Socoteli, ceasul și banii</span>
        <span class="game-foot">
          <span class="game-tag" data-i18n="tagMath">7–9 ani</span>
          <span class="game-rec" id="hub-rec-math" hidden></span>
        </span>
      </span>
    </button>
    <button class="game-card is-logic" id="hub-logic">
      <span class="game-badge" data-i18n="newBadge">Nou</span>
      <span class="game-art logic-art" id="hub-logic-art" aria-hidden="true"></span>
      <span class="game-body">
        <span class="game-title" data-i18n="gameLogic">Logică</span>
        <span class="game-sub" data-i18n="gameLogicSub">Șiruri, robotul și detectivi</span>
        <span class="game-foot">
          <span class="game-tag" data-i18n="tagLogic">7–10 ani</span>
          <span class="game-rec" id="hub-rec-logic" hidden></span>
        </span>
      </span>
    </button>
  </div>
</section>

<!-- ============================================================ HOME -->
<section class="screen" id="screen-home">
  <header class="home-head">
    <button class="icon-btn" id="btn-home-back" aria-label="Jocuri"></button>
    <div class="logo">
      <span class="logo-mark" aria-hidden="true"></span>
      <h1 class="logo-text" id="logo-text">STEAGURI</h1>
    </div>
    <button class="icon-btn" id="btn-settings" aria-label="Setari"></button>
  </header>

  <div class="levelbar">
    <div class="levelbar-badge"><span data-icon="trophy"></span> <b id="level-num">0</b> <span id="level-unit">țări</span></div>
    <div class="levelbar-track"><div class="levelbar-fill" id="xp-fill"></div></div>
    <div class="levelbar-xp" id="xp-note"></div>
  </div>

  <p class="home-hint" data-i18n="chooseMode">Alege un joc!</p>
  <div class="mode-grid" id="mode-grid"></div>

  <button class="ghost-btn" id="btn-gallery"><span data-icon="photos"></span><span data-i18n="gallery">Desenele mele</span></button>
</section>

<!-- ============================================================ PLAY -->
<section class="screen" id="screen-play">
  <header class="play-head">
    <button class="icon-btn" id="btn-back" aria-label="Inapoi"></button>
    <div class="dots" id="dots"></div>
    <div class="scorebox">
      <span class="streak" id="streak" hidden><span data-icon="flame"></span><b id="streak-num">0</b></span>
      <span class="lvl-chip"><span data-i18n="levelShort">Niv.</span> <b id="play-level">1</b></span>
      <b id="score">0</b>
    </div>
  </header>
  <div class="timer" id="timer" hidden><i id="timer-fill"></i></div>
  <div class="stage" id="stage"></div>
</section>

<!-- ========================================================== RESULT -->
<section class="screen" id="screen-result">
  <div class="result-card">
    <div class="stars" id="result-stars"><i>★</i><i>★</i><i>★</i></div>
    <h2 id="result-title">Bravo!</h2>
    <p class="result-line"><b id="result-score">0</b> <span data-i18n="points">puncte</span></p>
    <p class="result-line small" id="result-detail"></p>
    <div class="result-missed" id="result-missed"></div>
    <div class="result-actions">
      <button class="big-btn" id="btn-again" data-i18n="again">Inca o data</button>
      <button class="ghost-btn" id="btn-result-home" data-i18n="home">Acasa</button>
    </div>
  </div>
</section>

<!-- ========================================================= GALLERY -->
<section class="screen" id="screen-gallery">
  <header class="play-head">
    <button class="icon-btn" id="btn-gallery-back" aria-label="Inapoi"></button>
    <h2 class="head-title" data-i18n="gallery">Desenele mele</h2>
    <span class="icon-btn is-ghost" aria-hidden="true"></span>
  </header>
  <div class="gallery" id="gallery"></div>
</section>

<!-- ======================================================== SETTINGS -->
<div class="sheet" id="sheet-settings" hidden>
  <div class="sheet-card">
    <h2 data-i18n="settings">Setari</h2>

    <div class="setting-row">
      <span data-i18n="language">Limba</span>
      <div class="seg" id="seg-lang">
        <button data-val="ro">Romana</button>
        <button data-val="en">English</button>
      </div>
    </div>

    <div class="setting-row">
      <span data-i18n="sound">Sunet</span>
      <div class="seg" id="seg-sound">
        <button data-val="on" data-i18n="soundOn">Pornit</button>
        <button data-val="off" data-i18n="soundOff">Oprit</button>
      </div>
    </div>

    <div class="setting-row">
      <span data-i18n="timer">Cronometru</span>
      <div class="seg" id="seg-timer">
        <button data-val="on" data-i18n="timerOn">Pornit</button>
        <button data-val="off" data-i18n="timerOff">Oprit</button>
      </div>
    </div>

    <div class="setting-row">
      <span data-i18n="effects">Efecte</span>
      <div class="seg" id="seg-fx">
        <button data-val="high" data-i18n="fxHigh">Maxim</button>
        <button data-val="auto" data-i18n="fxAuto">Auto</button>
        <button data-val="low" data-i18n="fxLow">Rapid</button>
      </div>
    </div>

    <button class="ghost-btn danger" id="btn-reset" data-i18n="reset">Sterge progresul</button>
    <button class="big-btn" id="btn-close-settings" data-i18n="done">Gata</button>
  </div>
</div>

<div class="levelup" id="levelup" hidden>
  <div class="levelup-card">
    <span class="levelup-kicker" data-i18n="newLevel">Nivel nou!</span>
    <b class="levelup-num" id="levelup-num">2</b>
    <div class="unlocks" id="levelup-unlocks"></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="./js/icons.js"></script>
<script src="./js/data.js"></script>
<script src="./js/shapes.js"></script>
<script src="./js/lookalikes.js"></script>
<script src="./js/i18n.js"></script>
<script src="./js/store.js"></script>
<script src="./js/fx.js"></script>
<script src="./js/modes/quiz-kit.js"></script>
<script src="./js/modes/quiz-flag.js"></script>
<script src="./js/modes/quiz-name.js"></script>
<script src="./js/modes/quiz-shape.js"></script>
<script src="./js/modes/draw-free.js"></script>
<script src="./js/modes/draw-build.js"></script>
<script src="./js/modes/challenge.js"></script>
<script src="./js/atlas/meta.js"></script>
<script src="./js/atlas/geo.js"></script>
<script src="./js/atlas/map.js"></script>
<script src="./js/atlas/game.js"></script>
<script src="./js/math/pictures.js"></script>
<script src="./js/math/questions.js"></script>
<script src="./js/math/game.js"></script>
<script src="./js/logic/pictures.js"></script>
<script src="./js/logic/questions.js"></script>
<script src="./js/logic/game.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
